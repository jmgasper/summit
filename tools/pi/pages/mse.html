<!doctype html><html><head><meta charset="utf-8"><title>mse</title></head>
<!-- mse.html?src=FILE[&codec=avc1.640028]: plays a fragmented MP4 through
     Media Source Extensions (muted) and puts the frames presented and dropped
     (getVideoPlaybackQuality) and the time into the title each second. -->
<body style="margin:0;background:#222"><video id="v" autoplay muted width="1280"></video>
<script>
const q = new URLSearchParams(location.search);
const v = document.getElementById('v');
const source = new MediaSource();
v.src = URL.createObjectURL(source);
source.addEventListener('sourceopen', async () => {
  const buffer = source.addSourceBuffer('video/mp4; codecs="' + (q.get('codec') || 'avc1.640028') + '"');
  const data = await (await fetch(q.get('src') || 'frag-1080p30.mp4')).arrayBuffer();
  // In 2 MB pieces: a whole file can exceed what a SourceBuffer holds, and a
  // piece that does not fit is tried again once played data is evicted.
  let offset = 0;
  const next = () => {
    if (offset >= data.byteLength) { if (source.readyState === 'open') source.endOfStream(); return; }
    try {
      buffer.appendBuffer(data.slice(offset, offset + 2097152));
      offset += 2097152;
    } catch (error) {
      if (error.name !== 'QuotaExceededError') throw error;
      if (v.buffered.length && v.currentTime - v.buffered.start(0) > 2)
        buffer.remove(v.buffered.start(0), v.currentTime - 1);
      else
        setTimeout(next, 500);
    }
  };
  buffer.addEventListener('updateend', next);
  next();
});
setInterval(() => {
  const quality = v.getVideoPlaybackQuality();
  document.title = 'presented ' + (quality.totalVideoFrames - quality.droppedVideoFrames) + ' dropped ' + quality.droppedVideoFrames + ' t=' + v.currentTime.toFixed(1);
}, 1000);
</script></body></html>
