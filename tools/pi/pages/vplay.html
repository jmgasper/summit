<!doctype html><html><head><meta charset="utf-8"><title>video</title></head>
<!-- vplay.html?src=FILE[&w=WIDTH]: plays FILE (muted, looped) and puts the
     frames shown, the frames dropped and the time into the title each second. -->
<body style="margin:0;background:#222"><video id="v" autoplay muted loop></video>
<script>
const q = new URLSearchParams(location.search);
const v = document.getElementById('v');
v.width = +(q.get('w') || 1280);
v.src = q.get('src') || 'bbb12s.mp4';
let frames = 0;
function tick() { frames++; v.requestVideoFrameCallback(tick); }
if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(tick);
setInterval(() => {
  const quality = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null;
  document.title = 'frames ' + frames + ' dropped ' + (quality ? quality.droppedVideoFrames : '?') + ' t=' + v.currentTime.toFixed(1);
}, 1000);
</script></body></html>
