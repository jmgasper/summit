<!doctype html>
<html><head><meta charset="utf-8"><title>Storage test</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>Storage test</h1>
<p>Writes local and session storage and cookies for the Storage tab of Summit's developer tools. A frame from another
origin (the next port) keeps its own. <code>ticks</code> changes every two seconds, ten times.</p>
<p id="status">…</p>
<iframe src="" id="frame" width="480" height="80"></iframe>
<script>
localStorage.setItem('theme', 'dark');
localStorage.setItem('cart', JSON.stringify({ items: [{ id: 1, name: 'Kunanyi', qty: 2 }, { id: 7, name: 'Summit', qty: 1 }], total: 3 }));
localStorage.setItem('long', 'x'.repeat(5000));
localStorage.setItem('multi\nline key', 'first line\nsecond line');
sessionStorage.setItem('visit', String(Date.now()));
sessionStorage.setItem('tab', 'storage test');
document.cookie = 'prefs=compact; path=/; max-age=86400; SameSite=Lax';
document.cookie = 'visited=yes; path=/';
fetch('/api/cookie').then(() => { document.getElementById('status').textContent = 'Cookies set: ' + document.cookie; });
let ticks = 0;
const timer = setInterval(() => {
  localStorage.setItem('ticks', String(++ticks));
  if (ticks >= 10) clearInterval(timer);
}, 2000);
const frame = document.getElementById('frame');
frame.src = location.protocol + '//' + location.hostname + ':' + (Number(location.port) + 1) + '/frame.html';
</script>
</body></html>
