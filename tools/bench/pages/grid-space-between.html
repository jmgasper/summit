<!doctype html>
<meta charset="utf-8">
<title>Summit grid space-between probe: running</title>
<style>
body { font: 14px/1.4 sans-serif; margin: 20px; }
.grid { box-sizing: content-box; display: grid; width: 600px; grid-template-columns: minmax(0, 100px) minmax(0, 100px); gap: 20px; justify-content: space-between; margin-bottom: 12px; }
.item { height: 28px; border: 1px solid #4682b4; }
#narrow { width: 180px; }
.percent .item { width: 50%; }
.overflow .item { width: 50%; overflow-x: hidden; overflow-y: auto; }
.overflow-content { width: 150px; height: 60px; background: #dc143c; }
.rows { width: 100px; height: 600px; grid-template-columns: 100px; grid-template-rows: 100px 100px; align-content: space-between; justify-content: normal; }
.rows .item { height: auto; }
#short { height: 180px; }
.repeat { width: 500px; grid-template-columns: repeat(3, minmax(0, 100px)); }
.repeat-names { grid-template-columns: repeat(3, [named] minmax(0, 100px)); }
.fixed-margin .item { margin: 5px 7px 9px 11px; }
.auto-margin .item { margin-left: auto; }
pre { white-space: pre-wrap; }
</style>
<h1>Grid space-between geometry</h1>
<div id="wide" class="grid"><div class="item"></div><div class="item"></div></div>
<div id="narrow" class="grid"><div class="item"></div><div class="item"></div></div>
<div id="percent" class="grid percent"><div class="item"></div><div class="item"></div></div>
<div id="fallback" class="grid percent"><div class="item"></div><div class="item"></div></div>
<div id="overflow" class="grid overflow"><div class="item"><div class="overflow-content"></div></div><div class="item"><div class="overflow-content"></div></div></div>
<div id="tall" class="grid rows"><div class="item"></div><div class="item"></div></div>
<div id="short" class="grid rows"><div class="item"></div><div class="item"></div></div>
<div id="repeat" class="grid repeat"><div class="item"></div><div class="item"></div><div class="item"></div></div>
<div id="repeat-names" class="grid repeat repeat-names"><div class="item"></div><div class="item"></div><div class="item"></div></div>
<div id="fixed-margin" class="grid repeat fixed-margin"><div class="item"></div><div class="item"></div><div class="item"></div></div>
<div id="auto-margin" class="grid repeat auto-margin"><div class="item"></div><div class="item"></div><div class="item"></div></div>
<pre id="out">running…</pre>
<script>
"use strict";
const round = value => Math.round(value * 64) / 64;
function geometry(id) {
    const grid = document.getElementById(id);
    const root = grid.getBoundingClientRect();
    return [...grid.children].map(child => {
        const box = child.getBoundingClientRect();
        return [round(box.x - root.x), round(box.y - root.y), round(box.width), round(box.height)];
    });
}
function overflowMetrics() {
    const item = document.querySelector("#overflow .item");
    const child = item.firstElementChild;
    const itemBox = item.getBoundingClientRect();
    const childBox = child.getBoundingClientRect();
    return {
        items: geometry("overflow"),
        client: [item.clientWidth, item.clientHeight],
        scroll: [item.scrollWidth, item.scrollHeight],
        child: [round(childBox.x - itemBox.x), round(childBox.y - itemBox.y), round(childBox.width), round(childBox.height)]
    };
}
(async () => {
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const fallbackBefore = geometry("fallback");
    for (const item of document.querySelectorAll("#fallback .item"))
        item.style.boxSizing = "border-box";
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const result = {wide: geometry("wide"), narrow: geometry("narrow"), percent: geometry("percent"), fallback: {before: fallbackBefore, after: geometry("fallback")}, overflow: overflowMetrics(), tall: geometry("tall"), short: geometry("short"), repeat: geometry("repeat"), repeatNames: geometry("repeat-names"), fixedMargin: geometry("fixed-margin"), autoMargin: geometry("auto-margin")};
    document.getElementById("out").textContent = JSON.stringify(result, null, 2);
    await fetch("/__bench/probe", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(result)});
    document.title = "Summit grid space-between probe: done";
})().catch(error => {
    document.getElementById("out").textContent = String(error && error.stack || error);
    document.title = "Summit grid space-between probe: error";
});
</script>
