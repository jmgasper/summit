<!doctype html>
<meta charset="utf-8">
<title>Date/time input fixture</title>
<style>body{font:16px sans-serif;padding:20px}#value{position:absolute;left:24px;top:80px;width:360px;height:42px}button{position:absolute;left:400px;top:80px;height:42px}</style>
<h1>Native date and time picker</h1>
<input id="value" type="date" value="2024-02-28">
<button onclick="document.getElementById('value').showPicker()">Choose…</button>
<p style="margin-top:90px">1: date · 2: month · 3: week · 4: time · 5: local date/time</p>
<script>
const value=document.querySelector('#value');
const types=['date','month','week','time','datetime-local'];
const defaults=['2024-02-28','2024-02','2020-W53','12:34:56.789','2024-02-29T12:34:56.789'];
const capabilities={};
for(const type of types){const input=document.createElement('input');input.type=type;capabilities[type]=input.type===type;}
let state={type:value.type,value:value.value,input:0,change:0,capabilities};
try{value.showPicker();state.noActivation='unexpected success';}catch(e){state.noActivation=e.name;}
value.disabled=true;
try{value.showPicker();state.disabledPicker='unexpected success';}catch(e){state.disabledPicker=e.name;}
value.disabled=false;
function report(){state.type=value.type;state.value=value.value;state.valid=value.validity.valid;document.title='DATE '+JSON.stringify(state);}
function configure(index){
 value.removeAttribute('min');value.removeAttribute('max');value.step='any';
 value.type=types[index];value.value=defaults[index];state.input=0;state.change=0;report();
}
for(const type of ['input','change']) value.addEventListener(type,()=>{++state[type];report();});
document.addEventListener('keydown',e=>{
 if(/^[1-5]$/.test(e.key)){e.preventDefault();configure(Number(e.key)-1);}
 if(e.key==='b'){e.preventDefault();value.type='date';value.min='2024-02-01';value.max='2024-03-01';value.step='2';value.value='2024-02-01';state.input=state.change=0;report();}
 if(e.key==='r'){e.preventDefault();value.type='time';value.min='22:00';value.max='02:00';value.step='900';value.value='23:00';state.input=state.change=0;report();}
},true);
value.step='any';report();
</script>
