<!doctype html>
<meta charset="utf-8">
<title>wakelock: loading</title>
<p>Minimal reproduction for the page-process exit seen on https://browserbench.org/Speedometer3.1/ (docs/performance.md).
Open from a secure context (a file: URL works); Speedometer calls exactly this before its first suite.</p>
<pre id="out"></pre>
<script>
const out = document.getElementById("out");
const say = (text) => { out.textContent += text + "\n"; document.title = "wakelock: " + text; };
say("secure=" + isSecureContext + " api=" + ("wakeLock" in navigator));
setTimeout(async () => {
    if (!navigator.wakeLock) return say("no navigator.wakeLock");
    try {
        say("requesting");
        const sentinel = await navigator.wakeLock.request("screen");
        say("granted");
        await sentinel.release();
        say("released");
    } catch (error) { say("rejected " + error.name); }
}, 3000);
</script>
