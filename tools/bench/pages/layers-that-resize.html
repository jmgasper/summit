<!doctype html><meta charset="utf-8"><title>layers that change their size</title>
<style>
body { margin: 0; background: #f4f4f4; font: 22px sans-serif; }
#list div { height: 90px; margin: 6px 20px; background: #dde; border: 2px solid #88a; padding: 8px; box-sizing: border-box; }
.layer { position: absolute; will-change: transform; color: #fff; box-sizing: border-box; padding: 10px; }
/* What each of these shows depends on its size. */
#centered { left: 700px; top: 20px; width: 300px; height: 120px; background: #a33; text-align: center; display: flex; align-items: center; justify-content: center; }
#gradient { left: 700px; top: 330px; width: 300px; height: 120px; background: linear-gradient(to right, #000, #0a0); border-radius: 50%; }
#bordered { left: 700px; top: 640px; width: 300px; height: 120px; background: #335; border: 12px solid #fa0; border-radius: 30px; }
#image { left: 1350px; top: 20px; width: 300px; height: 120px; background: #222 radial-gradient(circle, #ff0 0 20%, transparent 21%) center / 50% 50% no-repeat; }
#shrinks { left: 1350px; top: 640px; width: 500px; height: 200px; background: #063; }
#footer { position: absolute; left: 0; right: 0; height: 60px; background: #222; color: #fff; bottom: auto; }
</style>
<div id="list"></div>
<div class="layer" id="centered">centred text</div>
<div class="layer" id="gradient"></div>
<div class="layer" id="bordered">border and corners</div>
<div class="layer" id="image"></div>
<div class="layer" id="shrinks">shrinks, then grows</div>
<script>
// Twelve steps 250 ms apart; the picture is taken after the last.
const list = document.getElementById('list');
let step = 0;
function next() {
    ++step;
    const entry = document.createElement('div');
    entry.textContent = 'entry ' + step + ' of a list that grows';
    list.appendChild(entry);
    for (const id of ['centered', 'gradient', 'bordered', 'image']) {
        const e = document.getElementById(id);
        e.style.width = (300 + step * 25) + 'px';
        e.style.height = (120 + step * 12) + 'px';
    }
    const s = document.getElementById('shrinks');
    s.style.width = (step < 7 ? 500 - step * 50 : 200 + (step - 6) * 60) + 'px';
    s.style.height = (step < 7 ? 200 - step * 20 : 80 + (step - 6) * 25) + 'px';
    if (step < 12) setTimeout(next, 250);
}
setTimeout(next, 800);
</script>
