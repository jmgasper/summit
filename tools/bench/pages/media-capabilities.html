<!doctype html>
<meta charset="utf-8">
<title>Summit media capability probe</title>
<video id="video"></video>
<script>
(async () => {
    const video = document.getElementById("video");
    const types = [
        "video/mp4",
        'video/mp4; codecs="avc1.42E01E, mp4a.40.2"',
        "application/vnd.apple.mpegurl",
        "application/x-mpegURL",
        "video/webm",
        'video/webm; codecs="vp9, opus"',
    ];
    const result = {
        userAgent: navigator.userAgent,
        mediaSource: typeof MediaSource,
        canPlayType: Object.fromEntries(types.map(type => [type, video.canPlayType(type)])),
    };
    await fetch("/__bench/probe", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(result)});
    document.title = "Summit media capability probe: done";
})().catch(error => { document.title = `Summit media capability probe: ${error}`; });
</script>
