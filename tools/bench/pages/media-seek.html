<!doctype html>
<meta charset="utf-8">
<title>Summit media seek probe</title>
<video id="video" muted playsinline controls
    src="https://v.redd.it/u5pu7ad5rcdh1/HLSPlaylist.m3u8"></video>
<script>
const video = document.getElementById("video");
const events = [];
const started = performance.now();
const snapshot = (name) => ({
    name, atMs: Math.round(performance.now() - started), time: video.currentTime,
    duration: video.duration, seeking: video.seeking, paused: video.paused,
    buffered: Array.from({length: video.buffered.length}, (_, i) =>
        [video.buffered.start(i), video.buffered.end(i)]),
    seekable: Array.from({length: video.seekable.length}, (_, i) =>
        [video.seekable.start(i), video.seekable.end(i)]),
});
for (const name of ["loadedmetadata", "canplay", "playing", "seeking", "seeked", "timeupdate", "waiting", "error", "ended"])
    video.addEventListener(name, () => events.push(snapshot(name)));
video.addEventListener("loadedmetadata", async () => {
    events.push(snapshot("before-seek"));
    video.currentTime = 8;
    events.push(snapshot("after-set-8"));
    try { await video.play(); }
    catch (error) { events.push({name: "play-rejected", message: String(error)}); }
}, {once: true});
setTimeout(async () => {
    events.push(snapshot("final"));
    const result = {
        src: video.currentSrc, events,
        error: video.error && {code: video.error.code, message: video.error.message},
    };
    await fetch("/__bench/probe", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(result)});
    document.title = `seek probe: ${video.currentTime.toFixed(2)}s`;
}, 9000);
</script>
