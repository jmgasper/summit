<!doctype html><meta charset=utf-8><title>blocking wheel listener</title>
<style>body{margin:0;font:20px sans-serif} .row{height:180px;border-bottom:1px solid #999;padding:20px;box-sizing:border-box} .row:nth-child(odd){background:#eef}</style>
<div id=wrap></div>
<script>
const p = new URLSearchParams(location.search);
const wrap = document.getElementById('wrap');
for (let i = 0; i < 400; i++) { const d = document.createElement('div'); d.className = 'row'; d.textContent = 'Row ' + i + ' lorem ipsum dolor sit amet, consectetur adipiscing elit'; wrap.appendChild(d); }
// A listener that may cancel, on an element (not window, document or body).
if (p.get('listener') !== '0')
    wrap.addEventListener('wheel', e => { if (p.get('prevent') === '1') e.preventDefault(); }, { passive: false });
// The main thread is busy for `busy` ms out of every `period` ms, as while a page loads.
const busy = +(p.get('busy') || 0), period = +(p.get('period') || 200);
if (busy) setInterval(() => { const end = performance.now() + busy; while (performance.now() < end) { } }, period);
</script>
