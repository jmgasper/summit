<!doctype html><meta charset="utf-8"><title>nested a</title>
<style>
body { margin: 0; height: 14000px; background: linear-gradient(#fff, #9cf); font: 20px sans-serif; }
#hud { position: fixed; top: 0; left: 0; right: 0; height: 70px; background: #222; color: #fff; font: bold 36px monospace; padding: 12px; z-index: 5; }
#sticky { position: sticky; top: 94px; height: 40px; background: #c33; color: #fff; font: bold 24px sans-serif; width: 300px; }
#inner { position: absolute; top: 120px; left: 3%; width: 94%; height: 330px; overflow: auto; background: #ffd; border: 4px solid #333; }
#inner div { height: 3000px; background: repeating-linear-gradient(#ffd 0 100px, #fb8 100px 200px); }
.mark { position: absolute; left: 20px; font-size: 28px; }
</style>
<div id="hud">page 0 inner 0</div>
<div id="sticky">sticky bar</div>
<div id="inner"><div></div></div>
<script>
for (let y = 0; y < 14000; y += 500) { const m = document.createElement('div'); m.className = 'mark'; m.style.top = y + 'px'; m.textContent = 'page ' + y; document.body.appendChild(m); }
const hud = document.getElementById('hud'), inner = document.getElementById('inner');
