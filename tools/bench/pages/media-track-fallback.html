<!doctype html>
<meta charset="utf-8">
<title>Summit media track fallback probe</title>
<video id="video" muted playsinline controls>
  <source src="/__bench/pages/unsupported-track.mp4" type="video/mp4">
  <source src="https://v.redd.it/u5pu7ad5rcdh1/HLSPlaylist.m3u8" type="application/vnd.apple.mpegurl">
</video>
<script>
const video = document.getElementById("video");
const events = [];
const start = performance.now();
for (const name of ["loadstart", "loadedmetadata", "loadeddata", "canplay", "playing", "timeupdate", "waiting", "stalled", "error", "ended"])
    video.addEventListener(name, () => events.push({name, atMs: Math.round(performance.now() - start), time: video.currentTime}));
video.play().catch(error => events.push({name: "play-rejected", message: String(error)}));
setTimeout(async () => {
    const result = {
        currentSrc: video.currentSrc, events, time: video.currentTime,
        duration: video.duration, readyState: video.readyState,
        networkState: video.networkState, width: video.videoWidth,
        height: video.videoHeight,
        error: video.error && {code: video.error.code, message: video.error.message},
    };
    await fetch("/__bench/probe", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(result)});
    document.title = `track fallback: ${video.currentTime.toFixed(2)}s`;
}, 18000);
</script>
