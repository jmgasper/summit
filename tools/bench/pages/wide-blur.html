<!doctype html>
<meta charset="utf-8">
<title>Wide blur</title>
<style>
body { margin: 20px; font: 15px sans-serif; background: #fff; }
.row { display: flex; gap: 20px; }
.box { width: 360px; height: 240px; position: relative; overflow: hidden; border: 1px solid #999; }
.art { position: absolute; inset: 0; background: linear-gradient(90deg, #e33 0 33%, #3a3 33% 66%, #36e 66%); }
.art::after { content: "SUMMIT"; position: absolute; left: 40px; top: 80px; font: bold 64px sans-serif; color: #fff; }
.wide { filter: blur(15px); }
.small { width: 120px; height: 80px; }
.small .art { filter: blur(15px); }
</style>
<p>GitHub issue #12: a large element with <code>filter: blur(15px)</code> (composited and blurred by
the GPU on Haiku since 2 October 2026), the same element unblurred, and a small blurred one (painted
with the filter). The left box should look like a soft version of the middle one.</p>
<div class="row">
  <div class="box"><div class="art wide"></div></div>
  <div class="box"><div class="art"></div></div>
  <div class="box small"><div class="art"></div></div>
</div>
