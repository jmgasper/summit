<!doctype html><meta charset="utf-8"><title>layers with effects</title>
<style>
body { margin: 0; height: 2000px; background: repeating-linear-gradient(45deg, #e8f0ff 0 40px, #f8c8a0 40px 80px); font: bold 30px sans-serif; }
.box { position: absolute; width: 900px; height: 400px; will-change: transform; }
.dot { position: absolute; left: 20px; top: 20px; width: 120px; height: 120px; background: #c22; color: #fff; }
/* Each box is a layer of several tiles with one small thing in it. */
#backdrop { left: 20px; top: 20px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
#blend { left: 960px; top: 20px; mix-blend-mode: multiply; }
#blend .dot { background: #2c2; }
#shadow { left: 20px; top: 440px; filter: drop-shadow(30px 30px 10px #000); }
#blur { left: 960px; top: 440px; filter: blur(6px); }
#opacity { left: 20px; top: 860px; opacity: 0.5; transform: rotate(3deg); }
#difference { left: 960px; top: 860px; mix-blend-mode: difference; }
#difference .dot { background: #fff; color: #000; }
</style>
<div class="box" id="backdrop"><div class="dot">backdrop</div></div>
<div class="box" id="blend"><div class="dot">multiply</div></div>
<div class="box" id="shadow"><div class="dot">shadow</div></div>
<div class="box" id="blur"><div class="dot">blur</div></div>
<div class="box" id="opacity"><div class="dot">opacity</div></div>
<div class="box" id="difference"><div class="dot">difference</div></div>
