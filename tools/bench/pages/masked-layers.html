<!doctype html><meta charset="utf-8"><title>masked layers</title>
<style>
body { margin: 0; height: 2000px; background: repeating-linear-gradient(#e8f0ff 0 80px, #c8d8f8 80px 160px); font: 24px sans-serif; }
.box { position: absolute; width: 1500px; height: 330px; will-change: transform; color: #fff; font: bold 40px sans-serif; }
/* Only the left third of each box may show: the rest of the mask is transparent, whole tiles of it. */
#a { top: 30px; left: 100px; background: #c22; -webkit-mask-image: linear-gradient(to right, #000 0 33%, transparent 33% 100%); mask-image: linear-gradient(to right, #000 0 33%, transparent 33% 100%); }
#b { top: 400px; left: 100px; background: #282; clip-path: polygon(0 0, 33% 0, 33% 100%, 0 100%); }
#c { top: 770px; left: 100px; background: #22c; border-radius: 160px; overflow: hidden; }
#c div { width: 100%; height: 100%; will-change: transform; background: #22c; }
</style>
<div class="box" id="a">mask-image: the left third</div>
<div class="box" id="b">clip-path: the left third</div>
<div class="box" id="c"><div>rounded corners over a layer</div></div>
