<!doctype html>
<!-- Pictures with a percentage height under boxes that settle that height (a
     stretched flex item, an aspect ratio, a fixed height) and under boxes that
     do not, with the heights around them changed step by step. The sizes after
     each step go into the title as a checksum and into #out in full; they have
     to be the same with SUMMIT_PERCENT_HEIGHT_CHAINS=all and without it, also
     in quirks mode (the same page without its first line). -->
<meta charset="utf-8">
<title>running</title>
<style>
html, body { margin: 0; }
body { font: 12px sans-serif; }
.case { margin: 4px; border: 1px solid #888; width: 600px; }
img { height: 100%; display: block; }
.row { display: flex; }
.col { display: flex; flex-direction: column; }
.grid { display: grid; grid-template-columns: 200px 1fr; }
.fill { flex: 1; min-height: 0; }
.h { height: 100%; }
#out { white-space: pre; font: 10px monospace; }
</style>
<body>
<div id="main" class="grid" style="height: auto">
  <div id="side" style="height: 300px; background: #eee"></div>
  <div id="feed">
    <!-- 1: stretched item of a row flex box with a height that changes -->
    <div class="case row" id="c1" style="height: 120px">
      <div><div class="h"><img></div></div>
      <div><div><img></div></div>
      <div style="width: 50px"></div>
    </div>
    <!-- 2: blocks under a fixed height that changes -->
    <div class="case" id="c2" style="height: 90px"><div class="h"><div class="h"><img></div></div><div><div><img></div></div></div>
    <!-- 3: aspect ratio, width changes -->
    <div class="case" id="c3" style="width: 300px; aspect-ratio: 3 / 1"><div class="h"><img></div></div>
    <!-- 4: nothing settles it: automatic blocks only -->
    <div class="case" id="c4"><div><div><img></div></div></div>
    <!-- 5: column flex box, growing item, height changes -->
    <div class="case col" id="c5" style="height: 200px">
      <div style="height: 40px"></div>
      <div class="fill"><div class="h"><img></div></div>
    </div>
    <!-- 6: picture as a flex item of a figure with a percentage height in a stretched item (Reddit's gallery) -->
    <div class="case row" id="c6" style="max-height: 140px; height: 140px">
      <div class="row" style="flex: 1"><figure class="row" style="margin: 0; height: 100%; width: 100%"><img></figure></div>
    </div>
    <!-- 7: block with a percentage height in a box with a percentage height in a fixed one -->
    <div class="case" id="c7" style="height: 160px"><div style="height: 50%"><div class="h"><img></div></div></div>
    <!-- 8: stretched grid item -->
    <div class="case grid" id="c8" style="height: 110px"><div><div class="h"><img></div></div><div></div></div>
    <!-- 9: min-height only -->
    <div class="case row" id="c9" style="min-height: 60px"><div><div class="h"><img></div></div></div>
    <!-- 10: a text block above the picture grows -->
    <div class="case row" id="c10" style="height: 150px"><div><p id="p10" style="margin: 0">text</p><div class="h"><img></div></div></div>
    <!-- 11: the stretched item is a block that holds a column of posts, each with a stretched picture box -->
    <div class="case row" id="c11" style="height: 260px">
      <div style="flex: 1">
        <div class="row" id="c11a" style="height: 70px"><div><div class="h"><img></div></div></div>
        <div class="row" id="c11b" style="height: 50%"><div><div class="h"><img></div></div></div>
        <div class="h" style="height: 20%"><img></div>
      </div>
    </div>
    <!-- 12: text beside the picture's box (anonymous blocks around the text) -->
    <div class="case row" id="c12" style="height: 100px"><div>text<div class="h"><img></div>more</div></div>
    <!-- 13: the picture in a line of text -->
    <div class="case row" id="c13" style="height: 100px"><div><div class="h">text <img style="display: inline"> text</div></div></div>
    <!-- 14: a picture box that is replaced by script (the box above is laid out with it) -->
    <div class="case row" id="c14" style="height: 100px"><div id="c14a"><div class="h"><img></div></div></div>
  </div>
</div>
<div id="out"></div>
<script>
const svg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="teal"/></svg>');
const images = [...document.images];
let loaded = 0;
for (const image of images) { image.onload = () => { if (++loaded == images.length) run(); }; image.src = svg; }
const steps = [
  () => {},
  () => { c1.style.height = '180px'; },
  () => { c2.style.height = '140px'; },
  () => { c3.style.width = '450px'; },
  () => { side.style.height = '900px'; },
  () => { c5.style.height = '320px'; },
  () => { c6.style.height = c6.style.maxHeight = '220px'; },
  () => { c7.style.height = '240px'; },
  () => { c8.style.height = '170px'; },
  () => { c9.style.minHeight = '130px'; },
  () => { p10.textContent = 'text '.repeat(200); },
  () => { main.style.height = '2000px'; },
  () => { c1.style.height = '60px'; c5.style.height = '100px'; },
  () => { document.getElementById('feed').style.width = '400px'; },
  () => { main.style.height = 'auto'; side.style.height = '100px'; },
  () => { for (const c of document.querySelectorAll('.case')) c.style.marginTop = '11px'; },
  () => { c2.style.height = 'auto'; },
  () => { c2.style.height = '75px'; c8.style.height = 'auto'; },
  () => { c11.style.height = '400px'; },
  () => { c11a.style.height = '30px'; },
  () => { c11.style.height = 'auto'; },
  () => { c11.style.height = '180px'; c11b.style.height = '90px'; },
  () => { c12.style.height = c13.style.height = '170px'; },
  () => { c14.style.height = '130px'; c14a.firstElementChild.style.height = '50%'; },
  () => { c12.style.height = c13.style.height = c14.style.height = 'auto'; },
  () => { c12.style.height = c13.style.height = c14.style.height = '64px'; },
];
function sizes() {
  return images.map(image => { const r = image.getBoundingClientRect(); return Math.round(r.width * 4) / 4 + 'x' + Math.round(r.height * 4) / 4; }).join(' ');
}
function run() {
  const lines = [];
  for (let index = 0; index < steps.length; ++index) {
    steps[index]();
    // Read the geometry after every change, as a page's script does.
    lines.push(index + ': ' + sizes());
    // And once more after a layout that had nothing to do.
    document.body.offsetHeight;
    lines.push(index + '+ ' + sizes());
  }
  const text = lines.join('\n');
  let sum = 0;
  for (let index = 0; index < text.length; ++index) sum = (sum * 31 + text.charCodeAt(index)) >>> 0;
  out.textContent = text;
  document.title = 'done ' + sum.toString(16);
  console.log('PERCENT-HEIGHT-CHAINS\n' + text);
}
</script>
