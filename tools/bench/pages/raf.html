<!doctype html>
<meta charset="utf-8">
<title>rAF probe</title>
<style>body{font:28px sans-serif;margin:2rem}</style>
<h1 id="out">starting…</h1>
<p id="timer">timer: 0</p>
<script>
let frames = 0, ticks = 0;
const out = document.getElementById("out");
const timer = document.getElementById("timer");
function frame() { frames++; out.textContent = "rAF frames: " + frames; requestAnimationFrame(frame); }
requestAnimationFrame(frame);
setInterval(() => { ticks++; timer.textContent = "timer: " + ticks + " (rAF " + frames + ")"; }, 500);
</script>
