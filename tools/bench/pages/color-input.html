<!doctype html>
<meta charset="utf-8">
<title>Color input fixture</title>
<style>body{font:16px sans-serif;padding:20px}input{position:absolute;left:24px;top:80px;width:80px;height:42px}</style>
<h1>Native color picker</h1>
<input id="color" type="color" value="#123456" list="suggestions" autofocus>
<datalist id="suggestions"><option value="#00ff00"><option value="#ff0000"></datalist>
<p style="margin-top:90px">Press U to update the value from script, D to disable it.</p>
<script>
const color = document.querySelector('#color');
const state = {type: color.type, value: color.value, input: 0, change: 0, noActivation: '', disabledPicker: ''};
try {color.showPicker(); state.noActivation='unexpected success';} catch(e) {state.noActivation=e.name;}
color.disabled=true;
try {color.showPicker(); state.disabledPicker='unexpected success';} catch(e) {state.disabledPicker=e.name;}
color.disabled=false;
function report(){state.value=color.value;document.title='COLOR '+JSON.stringify(state);}
for(const type of ['input','change']) color.addEventListener(type,()=>{++state[type];report();});
document.addEventListener('keydown',e=>{
 if(e.key.toLowerCase()==='u'){color.value='#fedcba';report();}
 if(e.key.toLowerCase()==='d'){color.disabled=true;report();}
});
report();
</script>
