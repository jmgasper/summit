<!doctype html>
<meta charset="utf-8">
<title>Summit viewport-origin fixed-position probe</title>
<style>
body { margin: 0; font: 16px sans-serif; }
#fixed-top { position: fixed; top: 12px; left: 21px; width: 180px; height: 42px; background: #e85; z-index: 2; }
#fixed-bottom { position: fixed; bottom: 17px; right: 23px; width: 130px; height: 39px; background: #59d; z-index: 2; }
#sticky { position: sticky; top: 70px; width: 220px; height: 34px; background: #8b5; }
#spacer { height: 3000px; background: repeating-linear-gradient(#eee 0 100px, #ddd 100px 200px); }
</style>
<div id="fixed-top">Fixed top</div>
<div id="fixed-bottom">Fixed bottom</div>
<div id="sticky">Sticky</div>
<div id="spacer"></div>
<script>
(async () => {
    const ids = ["fixed-top", "fixed-bottom", "sticky"];
    const round = value => Math.round(value * 64) / 64;
    const results = [];
    for (const y of [0, 200, 600, 1200, 30]) {
        scrollTo(0, y);
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const boxes = {};
        for (const id of ids) {
            const rect = document.getElementById(id).getBoundingClientRect();
            boxes[id] = [round(rect.x), round(rect.y), round(rect.width), round(rect.height)];
        }
        results.push({requestedY: y, scrollY: round(scrollY), boxes});
    }
    const result = {innerWidth, innerHeight, results};
    await fetch("/__bench/probe", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(result)});
    document.title = "Summit viewport-origin fixed-position probe: done";
})().catch(error => { document.title = `Summit viewport-origin fixed-position probe: ${error}`; });
</script>
