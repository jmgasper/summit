<!doctype html><meta charset="utf-8"><title>empty tiles</title>
<style>
body { margin: 0; height: 3000px; background: repeating-linear-gradient(#e8f0ff 0 80px, #c8d8f8 80px 160px); font: 24px sans-serif; }
#overlay { position: fixed; inset: 0; will-change: transform; pointer-events: none; }
#box { position: absolute; left: 300px; top: 200px; width: 100px; height: 100px; background: #d22; display: none; }
#big { position: absolute; left: 500px; top: 150px; width: 700px; height: 450px; background: rgba(0, 120, 0, 0.5); display: none; }
#label { position: absolute; left: 20px; top: 20px; background: #222; color: #fff; padding: 8px; }
</style>
<div id="overlay"><div id="label">stage 0</div><div id="box"></div><div id="big"></div></div>
<script>
// Stages follow each other 400 ms apart, each after the overlay has been painted in the state before it,
// and stop at the one the address names: ?stage=N
const last = Number(new URLSearchParams(location.search).get('stage') || 4);
const box = document.getElementById('box'), big = document.getElementById('big'), label = document.getElementById('label');
const stages = [
    () => { },
    () => { box.style.display = 'block'; },                                  // a small box in a tile that had nothing
    () => { box.style.left = '900px'; box.style.top = '500px'; },            // leaves one tile empty, enters another
    () => { box.style.display = 'none'; },                                   // everything but the label is empty again
    () => { big.style.display = 'block'; box.style.display = 'block'; },     // a translucent area over several tiles
];
let stage = 0;
function next() {
    if (stage >= last) return;
    ++stage; stages[stage](); label.textContent = 'stage ' + stage;
    setTimeout(next, 400);
}
setTimeout(next, 1200);
</script>
