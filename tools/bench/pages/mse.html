<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MSE</title>
<!--
Media Source Extensions check. Appends fragmented MP4 video and audio (made by
tools/bench/make-mse-fixtures.sh into mse-media/) to two SourceBuffers in
chunks, plays, and optionally seeks. The document title carries a compact
status so a harness can read it through summitctl's tab state:
  "MSE t=<currentTime> rs=<readyState> buf=<ranges> q=<frames>/<dropped> ev=<events>"
Once playback ends or fails (or after 25 s) the result is also posted to
/__bench/probe, so tools/bench/run-probe.py --page mse.html completes.

Query parameters:
  mode=file      use ordinary video.src playback with the same checks
  chunk=<bytes>   append size (default 262144)
  seek=<seconds>  seek there once playback passes 3 s
  muted=1         start muted (autoplay without a gesture)
  video=<file>    video fragments (default video-frag.mp4)
  audio=<file>    audio fragments (default audio-frag.mp4; "none" for video only)
  busy=<ms>       block the page thread for this long every second, as a
                  script-heavy page does, to see whether video keeps moving
  width=<pixels>  displayed video width (default 640); aspect ratio follows source
  expectedFrames=<count>  require this exact total frame count at normal end
  timeoutMs=<ms>  report timeout after this interval (default 25000)
  pauseAt=<seconds>  pause once playback reaches this time, then resume
  pauseMs=<ms>    pause duration (default 1500, plus 250 ms settling)
  pausedSeek=<seconds>  optionally seek while paused before checking stability
  capturePausedFrame=1  include the paused picture as a full-size PNG in the result
-->
<style>
body { font: 16px monospace; margin: 12px; }
video { width: 640px; height: 360px; background: #000; display: block; }
#log { white-space: pre; font-size: 13px; }
</style>
</head>
<body>
<video id="video" controls playsinline></video>
<div id="status"></div>
<div id="log"></div>
<script>
const params = new URLSearchParams(location.search);
const fileMode = params.get('mode') === 'file';
const playbackMode = fileMode ? 'FILE' : 'MSE';
const chunk = Number(params.get('chunk') || 262144);
const seekTo = params.has('seek') ? Number(params.get('seek')) : null;
const videoFile = params.get('video') || 'video-frag.mp4';
const audioFile = params.get('audio') || 'audio-frag.mp4';
const expectedFrames = params.has('expectedFrames') ? Number(params.get('expectedFrames')) : null;
const pauseAt = params.has('pauseAt') ? Number(params.get('pauseAt')) : null;
const pauseMs = Number(params.get('pauseMs') || 1500);
const pausedSeek = params.has('pausedSeek') ? Number(params.get('pausedSeek')) : null;
const video = document.getElementById('video');
const displayWidth = Number(params.get('width') || 640);
if (Number.isFinite(displayWidth) && displayWidth > 0) {
    video.style.width = `${displayWidth}px`;
    video.style.height = 'auto';
}
video.muted = params.get('muted') === '1';
const events = [];
const timeline = [];
const started = performance.now();
function log(text) {
    const line = ((performance.now() - started) / 1000).toFixed(2) + ' ' + text;
    events.push(text.split(' ')[0]);
    timeline.push({atMs: Math.round(performance.now() - started), event: text});
    document.getElementById('log').textContent += line + '\n';
}
function ranges(r) {
    let out = [];
    for (let i = 0; i < r.length; ++i)
        out.push(r.start(i).toFixed(2) + '-' + r.end(i).toFixed(2));
    return out.join(',') || 'none';
}
for (const name of ['loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough', 'playing', 'waiting', 'seeking', 'seeked', 'ended', 'error', 'pause', 'play', 'stalled'])
    video.addEventListener(name, () => log(name + ' t=' + video.currentTime.toFixed(3) + (name === 'error' && video.error ? ' code=' + video.error.code + ' ' + video.error.message : '')));

const types = ['video/mp4; codecs="avc1.640028"', 'video/mp4; codecs="avc1.4d401f"', 'audio/mp4; codecs="mp4a.40.2"',
    'video/webm; codecs="vp9"', 'audio/webm; codecs="opus"', 'video/mp4; codecs="av01.0.05M.08"'];
log('isTypeSupported ' + types.map(t => t.replace(/ codecs=/, '') + '=' + (window.MediaSource ? MediaSource.isTypeSupported(t) : 'noMSE')).join(' '));

let seeked = false;
let pauseStarted = false;
let pauseCheck = null;
let pausedFrame = null;
async function checkPause() {
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 72;
    const context = canvas.getContext('2d', {willReadFrequently: true});
    let seekFrameWaitMs = null;
    function sample() {
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
        return {
            time: video.currentTime,
            frames: video.getVideoPlaybackQuality().totalVideoFrames,
            pixels,
            hasPicture: pixels.some((value, index) => index % 4 !== 3 && value !== pixels[index % 4]),
        };
    }
    try {
        video.pause();
        if (pausedSeek !== null) {
            const previousFrames = video.getVideoPlaybackQuality().totalVideoFrames;
            const seekStarted = performance.now();
            await new Promise((resolve, reject) => {
                const timeout = setTimeout(() => reject(new Error('paused seek timeout')), 5000);
                video.addEventListener('seeked', () => { clearTimeout(timeout); resolve(); }, {once: true});
                video.currentTime = pausedSeek;
            });
            // The Haiku backend can resolve its seek when samples are queued,
            // before the decoder supplies the target picture. Measure that
            // arrival separately before testing whether a paused picture moves.
            while (video.getVideoPlaybackQuality().totalVideoFrames <= previousFrames) {
                if (performance.now() - seekStarted > 5000)
                    throw new Error('paused seek picture timeout');
                await sleep(25);
            }
            seekFrameWaitMs = performance.now() - seekStarted;
        }
        await sleep(250);
        const before = sample();
        await sleep(pauseMs);
        const after = sample();
        const samePixels = before.pixels.every((value, index) => value === after.pixels[index]);
        if (params.get('capturePausedFrame') === '1') {
            const picture = document.createElement('canvas');
            picture.width = video.videoWidth;
            picture.height = video.videoHeight;
            picture.getContext('2d').drawImage(video, 0, 0);
            pausedFrame = {time: video.currentTime, width: picture.width, height: picture.height,
                png: picture.toDataURL('image/png')};
        }
        pauseCheck = {beforeTime: before.time, afterTime: after.time,
            beforeFrames: before.frames, afterFrames: after.frames, samePixels,
            hasPicture: before.hasPicture && after.hasPicture, target: pausedSeek, seekFrameWaitMs,
            passed: video.paused && !video.seeking && Math.abs(after.time - before.time) < .05
                && (pausedSeek === null || Math.abs(after.time - pausedSeek) < .05)
                && before.frames === after.frames && samePixels && before.hasPicture && after.hasPicture};
        log('pauseCheck ' + JSON.stringify(pauseCheck));
        await video.play();
    } catch (error) {
        pauseCheck = {passed: false, error: String(error)};
        await report('pause-error');
    }
}
function update() {
    const q = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null;
    const status = `${playbackMode} t=${video.currentTime.toFixed(2)} rs=${video.readyState} buf=${ranges(video.buffered)} q=${q ? q.totalVideoFrames + '/' + q.droppedVideoFrames : '-'} ev=${events.filter(e => e !== 'isTypeSupported').join('>')}`;
    document.title = status.slice(0, 200);
    document.getElementById('status').textContent = status;
    if (seekTo !== null && !seeked && video.currentTime > 3) {
        seeked = true;
        video.currentTime = seekTo;
    }
    if (pauseAt !== null && !pauseStarted && video.currentTime >= pauseAt) {
        pauseStarted = true;
        checkPause();
    }
}
setInterval(update, 250);

let reported = false;
async function report(why) {
    if (reported)
        return;
    reported = true;
    update();
    const q = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null;
    const result = {
        src: playbackMode.toLowerCase() + ':' + videoFile, why, status: document.title, events: timeline,
        time: video.currentTime, duration: video.duration, readyState: video.readyState,
        buffered: ranges(video.buffered), frames: q && q.totalVideoFrames, dropped: q && q.droppedVideoFrames,
        width: video.videoWidth, height: video.videoHeight,
        displayed: {width: video.clientWidth, height: video.clientHeight},
        viewport: {width: innerWidth, height: innerHeight, devicePixelRatio},
        error: video.error && {code: video.error.code, message: video.error.message},
    };
    if (expectedFrames !== null) {
        result.expectedFrames = expectedFrames;
        result.passed = Number.isSafeInteger(expectedFrames) && expectedFrames > 0
            && why === 'ended' && !result.error && result.frames === expectedFrames;
    }
    if (pauseAt !== null) {
        result.pauseCheck = pauseCheck;
        if (pausedFrame)
            result.pausedFrame = pausedFrame;
        result.passed = result.passed !== false && why === 'ended' && !result.error
            && !!pauseCheck && pauseCheck.passed;
    }
    try {
        await fetch('/__bench/probe', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)});
    } catch (error) {
    }
}
video.addEventListener('ended', () => setTimeout(() => report('ended'), 300));
video.addEventListener('error', () => report('error'));
const timeoutMs = Number(params.get('timeoutMs') || 25000);
setTimeout(() => report('timeout'), Number.isFinite(timeoutMs) && timeoutMs > 0 ? timeoutMs : 25000);
if (params.has('busy')) {
    const busy = Number(params.get('busy'));
    setInterval(() => { const end = performance.now() + busy; while (performance.now() < end) { } }, 1000);
}

async function feed(buffer, url) {
    const response = await fetch('mse-media/' + url);
    const data = new Uint8Array(await response.arrayBuffer());
    for (let at = 0; at < data.length; at += chunk) {
        buffer.appendBuffer(data.subarray(at, Math.min(data.length, at + chunk)));
        await new Promise((resolve, reject) => {
            buffer.addEventListener('updateend', resolve, { once: true });
            buffer.addEventListener('error', () => reject(new Error('append error')), { once: true });
        });
    }
    log('appended ' + url + ' ' + data.length);
}

if (fileMode) {
    video.src = 'mse-media/' + videoFile;
    video.play().then(() => log('playPromise resolved')).catch(error => log('playPromise ' + error.name));
} else if (!window.MediaSource)
    log('error no MediaSource');
else {
    const source = new MediaSource();
    video.src = URL.createObjectURL(source);
    source.addEventListener('sourceopen', async () => {
        log('sourceopen');
        try {
            const feeds = [feed(source.addSourceBuffer('video/mp4; codecs="avc1.640028"'), videoFile)];
            if (audioFile !== 'none')
                feeds.push(feed(source.addSourceBuffer('audio/mp4; codecs="mp4a.40.2"'), audioFile));
            await Promise.all(feeds);
            source.endOfStream();
            log('endOfStream duration=' + source.duration.toFixed(3));
        } catch (error) {
            log('error ' + error);
        }
    });
    video.play().then(() => log('playPromise resolved')).catch(error => log('playPromise ' + error.name));
}
</script>
</body>
</html>
