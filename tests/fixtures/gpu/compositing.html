<!doctype html>
<meta charset="utf-8">
<title>Summit compositing check</title>
<style>
  body { margin: 0; background: #ffffff; font: 15px sans-serif; height: 2000px; }
  .grid { position: absolute; left: 20px; top: 20px; display: grid; grid-template-columns: repeat(4, 160px); gap: 16px; }
  .cell { height: 100px; position: relative; border: 1px solid #999; }
  /* Asymmetric colours: red top-left, blue bottom-right catch Y flips and R/B swaps. */
  .orient { background: linear-gradient(135deg, #ff0000 0 50%, #0000ff 50% 100%); }
  .translucent { background: #00a000; opacity: 0.5; will-change: opacity; }
  .shadow { background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.45); will-change: transform; }
  .spin { background: #f0a000; animation: spin 2s linear infinite; }
  .layer3d { background: #8040c0; transform: translateZ(0) rotate(8deg); }
  .text { will-change: transform; padding: 8px; }
  .fixed { position: fixed; right: 20px; bottom: 20px; width: 180px; padding: 10px; background: rgba(0,0,0,.7); color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<div class="grid">
  <div class="cell orient" title="red top-left, blue bottom-right"></div>
  <div class="cell translucent" title="50% green over white = (127,208,127)"></div>
  <div class="cell shadow" title="white card with soft shadow"></div>
  <div class="cell spin" title="rotating orange square"></div>
  <div class="cell layer3d" title="purple, rotated 8 degrees"></div>
  <div class="cell text" title="text in a composited layer">Composited text layer: the quick brown fox.</div>
</div>
<div class="fixed">position: fixed — must stay put while scrolling</div>
<script>
  // Report which compositing path the page runs in, for the harness and the viewer.
  document.title += " — " + (window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduced motion" : "animating");
</script>
