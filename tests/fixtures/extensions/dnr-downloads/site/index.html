<!doctype html><meta charset="utf-8"><title>DNR fixture page</title>
<p>Each line reports whether a request reached the server. With the fixture's
rules installed, the blocked lines must say BLOCKED and the control line LOADED.</p>
<ul id="out"></ul>
<script>
const probes = [
  ['session rule (dnr-blocked)', 'dnr-blocked.txt'],
  ['dynamic rule (dnr-dynamic-blocked)', 'dnr-dynamic-blocked.txt'],
  ['static ruleset (dnr-static-blocked)', 'dnr-static-blocked.txt'],
  ['control', 'allowed.txt'],
];
for (const [label, path] of probes) {
  const item = document.createElement('li');
  document.getElementById('out').append(item);
  fetch(path + '?' + Date.now()).then(r => r.text()).then(() => { item.textContent = `${label}: LOADED`; },
    () => { item.textContent = `${label}: BLOCKED`; });
}
</script>
