<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start Page</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#243f36;font:16px/1.5 system-ui,sans-serif;background:#f9fbf8}
main{max-width:840px;margin:auto;padding:62px 48px 38px}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:700;color:#71877b}
h1{font-size:42px;line-height:1.15;letter-spacing:-1px;margin:16px 0}p{color:#63766b;margin:0}
.landscape{height:156px;position:relative;margin:30px 0 38px;background:linear-gradient(120deg,#e7efe6,#eff3e9);overflow:hidden;border-radius:12px}
.sun{position:absolute;width:54px;height:54px;border-radius:50%;background:#ead8ab;right:88px;top:22px}
.ridge{position:absolute;inset:0;background:#c1d4c1;clip-path:polygon(0 100%,0 90%,18% 37%,31% 64%,45% 19%,62% 65%,78% 43%,100% 77%,100% 100%)}
.ridge.front{background:#799e86;clip-path:polygon(0 100%,0 96%,21% 76%,38% 97%,61% 45%,80% 77%,100% 67%,100% 100%)}
h2{font-size:16px;margin:0 0 14px}.favorites{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
a{color:inherit;text-decoration:none}.favorite{padding:18px 12px;background:white;border:1px solid #e2e9e1;border-radius:9px;text-align:center;font-size:13px;transition:background .15s}
.favorite:hover{background:#eef5ed}.tile{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:22px;margin:0 auto 10px;background:#e8f1e6;color:#456c51}
.note{border-top:1px solid #e0e8de;margin-top:42px;padding-top:18px;font-size:12px;color:#7b897f}.keys{float:right}
@media(max-width:660px){main{padding:38px 24px}.favorites{grid-template-columns:repeat(2,1fr)}h1{font-size:34px}.keys{float:none;display:block}}
</style>
<main>
<div class="eyebrow">KUNANYIOS / SUMMIT</div>
<h1>A little more perspective.</h1>
<p>Your next discovery starts here.</p>
<div class="landscape" aria-hidden="true"><div class="sun"></div><div class="ridge"></div><div class="ridge front"></div></div>
<h2>Favorites</h2>
<div class="favorites">
<a class="favorite" href="https://www.haiku-os.org/"><div class="tile">H</div>Haiku Project</a>
<a class="favorite" href="https://webkit.org/"><div class="tile">W</div>WebKit</a>
<a class="favorite" href="https://en.wikipedia.org/"><div class="tile">W</div>Wikipedia</a>
<a class="favorite" href="https://duckduckgo.com/"><div class="tile">D</div>DuckDuckGo</a>
</div>
<div class="note">Made for a different view of the web.<span class="keys">Alt+L &nbsp; Search &nbsp; · &nbsp; Alt+T &nbsp; New tab</span></div>
</main>
</html>
