<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 64 64"
     role="img" aria-labelledby="title description">
  <title id="title">Summit — Back</title>
  <desc id="description">A left-pointing, faceted blue-grey navigation arrow with pale upper-left highlights, dark lower-right faces and a soft vector shadow. Its colours match the Summit mountain icon. Square transparent canvas; editable vector paths and gradients only.</desc>
  <defs>
    <!-- Colours are taken from the companion Summit mountain SVG. -->
    <linearGradient id="front-face" gradientUnits="userSpaceOnUse" x1="19" y1="15" x2="44" y2="47">
      <stop offset="0" stop-color="#83b0ca"/>
      <stop offset=".48" stop-color="#6398ba"/>
      <stop offset="1" stop-color="#386e99"/>
    </linearGradient>
    <linearGradient id="upper-facet" gradientUnits="userSpaceOnUse" x1="18" y1="18" x2="29" y2="32">
      <stop offset="0" stop-color="#98bfd5"/>
      <stop offset="1" stop-color="#83b0ca"/>
    </linearGradient>
    <linearGradient id="lower-facet" gradientUnits="userSpaceOnUse" x1="18" y1="29" x2="29" y2="48">
      <stop offset="0" stop-color="#6398ba"/>
      <stop offset="1" stop-color="#386e99"/>
    </linearGradient>
    <linearGradient id="upper-shaft" gradientUnits="userSpaceOnUse" x1="26" y1="24" x2="49" y2="35">
      <stop offset="0" stop-color="#83b0ca"/>
      <stop offset="1" stop-color="#6398ba"/>
    </linearGradient>
    <linearGradient id="light-bevel" gradientUnits="userSpaceOnUse" x1="12" y1="17" x2="48" y2="29">
      <stop offset="0" stop-color="#c3e3f3"/>
      <stop offset=".55" stop-color="#b0d5e8"/>
      <stop offset="1" stop-color="#94bdd7"/>
    </linearGradient>
    <linearGradient id="dark-bevel" gradientUnits="userSpaceOnUse" x1="15" y1="29" x2="43" y2="51">
      <stop offset="0" stop-color="#386e99"/>
      <stop offset="1" stop-color="#2c5879"/>
    </linearGradient>
    <linearGradient id="right-bevel" gradientUnits="userSpaceOnUse" x1="28" y1="18" x2="50" y2="44">
      <stop offset="0" stop-color="#6398ba"/>
      <stop offset="1" stop-color="#305970"/>
    </linearGradient>
    <linearGradient id="extruded-right" gradientUnits="userSpaceOnUse" x1="29" y1="16" x2="55" y2="49">
      <stop offset="0" stop-color="#305970"/>
      <stop offset=".58" stop-color="#284f6d"/>
      <stop offset="1" stop-color="#2c5879"/>
    </linearGradient>
    <linearGradient id="extruded-bottom" gradientUnits="userSpaceOnUse" x1="16" y1="33" x2="40" y2="55">
      <stop offset="0" stop-color="#1d3b50"/>
      <stop offset="1" stop-color="#1b3e5c"/>
    </linearGradient>
  </defs>

