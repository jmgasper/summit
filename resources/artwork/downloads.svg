<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Summit — Downloads, front view</title>
  <desc id="description">A straight-on golden download arrow centred above a blue-grey tray with an ivory rim. Horizontal edges, symmetric outlines, faceted shading and bevelled highlights; no tilted or receding side faces. The palette matches the Summit navigation icons. Transparent square canvas with editable vector paths and gradients only; no embedded bitmap, font, filter or external asset.</desc>
